<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Board - Viewer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000000;
            color: #f10a0a;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 12px 20px;
            border-bottom: 1px solid #e0e0e0;
            background: #000000;
            font-size: 1rem;
            color: #f10a0a;
        }
        .header span.label {
            font-weight: 600;
            color: #333;
        }
        .main-layout {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .messages {
            flex: 3;
            overflow-y: auto;
            padding: 20px;
        }
        .message {
            margin-bottom: 18px;
            font-size: 5.0rem; /* large for bedside viewing */
            line-height: 1.4;
            color:#f5f5f5
        }
        .timestamp {
            font-size: 0.9rem;
            color: #f5f5f5;
            margin-top: 4px;
        }
        .empty-state {
            margin-top: 40px;
            font-size: 1.5rem;
            color: #999;
            text-align: center;
        }
        .new-banner {
            text-align: center;
            padding: 6px 0;
            background: #f10a0a;
            color: #000000;
            font-weight: 700;
            font-size: 1.2rem;
            display: none;
        }
        .tasks-pane {
            flex: 1;
            border-left: 1px solid #333;
            padding: 12px 14px;
            background: #050505;
            font-size: 0.95rem;
            color: #e5e7eb;
            display: flex;
            flex-direction: column;
            min-width: 240px;
            max-width: 360px;
        }
        .tasks-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #bbf7d0;
        }
        .tasks-input-row {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }
        .tasks-input-row input {
            flex: 1;
            padding: 4px 6px;
            border-radius: 4px;
            border: 1px solid #4b5563;
            background: #020617;
            color: #e5e7eb;
            font-size: 0.85rem;
        }
        .tasks-input-row button {
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #22c55e;
            background: #022c22;
            color: #bbf7d0;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .tasks-list {
            flex: 1;
            overflow-y: auto;
            border-radius: 4px;
            border: 1px solid #1f2937;
            padding: 6px 6px 4px 6px;
            background: #020617;
        }
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 6px;
            margin-bottom: 4px;
            padding: 4px 4px;
            border-radius: 4px;
            background: #030712;
            font-size: 0.85rem;
        }
        .task-text {
            flex: 1;
            word-break: break-word;
        }
        .task-delete-btn {
            border: 1px solid #f97373;
            background: #450a0a;
            color: #fecaca;
            border-radius: 4px;
            font-size: 0.7rem;
            padding: 2px 6px;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Intercom controls */
        .intercom-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 12px;
            background: #050505;
            border-bottom: 1px solid #333;
            font-size: 0.85rem;
            align-items: center;
        }
        .intercom-bar label {
            color: #e5e7eb;
            margin-right: 4px;
            font-weight: 500;
        }
        .intercom-bar input {
            padding: 3px 6px;
            border-radius: 4px;
            border: 1px solid #4b5563;
            background: #020617;
            color: #e5e7eb;
            font-size: 0.8rem;
        }
        .intercom-bar button {
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #22c55e;
            background: #022c22;
            color: #bbf7d0;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .stations-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 4px 12px 8px 12px;
            background: #050505;
            border-bottom: 1px solid #1f2937;
            font-size: 0.8rem;
            align-items: center;
            color: #9ca3af;
        }
        .stations-bar-label {
            font-weight: 500;
            margin-right: 4px;
            color: #e5e7eb;
        }
        .station-chip {
            padding: 2px 8px;
            border-radius: 9999px;
            border: 1px solid #4b5563;
            background: #030712;
            color: #e5e7eb;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .station-chip:hover {
            border-color: #22c55e;
            background: #022c22;
        }

        @media print {
            body {
                background: #ffffff;
                color: #000000;
            }

            /* Hide header, intercom controls, stations bar, and main message area when printing */
            .header,
            .intercom-bar,
            .stations-bar,
            #messages,
            #newBanner {
                display: none !important;
            }

            /* Expand the tasks pane to use the full page width */
            .tasks-pane {
                max-width: none;
                min-width: 0;
                border-left: none;
                background: #ffffff;
                color: #000000;
            }

            /* Hide most interactive controls and non-daily lists when printing */
            #muteToggle,
            #repliesToggle,
            #taskInput,
            #addTaskBtn,
            #tasksList,
            #repliesList,
            #medNameSelect,
            #medTabletsInput,
            #addMedDoseBtn,
            #medNotesInput,
            #medStatus,
            #medsList,
            #clearMessagesBtn,
            #clearRepliesBtn,
            #sendMessageBtn,
            #toStation,
            #messageInput,
            #saveIdentityBtn,
            .task-delete-btn,
            #loadDailyMedLogBtn,
            #printDailyMedLogBtn {
                display: none !important;
            }

            /* Keep the Daily Med Log title, date, and list visible */
            #dailyMedDate,
            #dailyMedsList {
                display: block;
            }
        }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="header">
        <span class="label">Message Board</span>
        &nbsp;&middot;&nbsp;
        This page can stay open on the Chromebook/pc.
        &nbsp;&middot;&nbsp;
        <button id="muteToggle" style="margin-left: 12px; padding: 4px 10px; font-size: 0.9rem; cursor: pointer; border-radius: 4px; border: 1px solid #f10a0a; background: #000; color: #f10a0a;">
            🔊 Auto Read: ON
        </button>
        &nbsp;&middot;&nbsp;
        <button id="repliesToggle" style="margin-left: 12px; padding: 4px 10px; font-size: 0.9rem; cursor: pointer; border-radius: 4px; border: 1px solid #4ade80; background: #000; color: #4ade80;">
            🎤 Voice Replies: OFF
        </button>
        &nbsp;&middot;&nbsp;
        <button id="clearMessagesBtn" style="margin-left: 12px; padding: 4px 10px; font-size: 0.9rem; cursor: pointer; border-radius: 4px; border: 1px solid #facc15; background: #000; color: #facc15;">
            🧹 Clear Messages
        </button>
        &nbsp;&middot;&nbsp;
        <button id="clearRepliesBtn" style="margin-left: 12px; padding: 4px 10px; font-size: 0.9rem; cursor: pointer; border-radius: 4px; border: 1px solid #a5b4fc; background: #000; color: #a5b4fc;">
            🧽 Clear Replies
        </button>
    </div>
    <div class="intercom-bar">
        <label for="householdId">Household:</label>
        <input id="householdId" type="text" placeholder="smith_home" />
        <label for="stationId">Station:</label>
        <input id="stationId" type="text" placeholder="bedside" />
        <label for="displayName">Name:</label>
        <input id="displayName" type="text" placeholder="Bedside Chromebook" />
        <button id="saveIdentityBtn">Save</button>
        <label for="toStation" style="margin-left:12px;">To:</label>
        <input id="toStation" type="text" placeholder="all or station id" />
        <input id="messageInput" type="text" placeholder="Type message..." style="flex:1; min-width:160px;" />
        <button id="sendMessageBtn">Send</button>
    </div>
    <div id="stationsBar" class="stations-bar">
        <span class="stations-bar-label">Known stations:</span>
        <span id="stationsEmpty" style="font-size:0.75rem; color:#6b7280;">(none yet)</span>
    </div>
    <div id="newBanner" class="new-banner">NEW MESSAGE</div>
    <div class="main-layout">
        <div class="messages" id="messages"></div>
        <div class="tasks-pane">
            <div class="tasks-title">Tasks</div>
            <div class="tasks-input-row">
                <input id="taskInput" type="text" placeholder="New task..." />
                <button id="addTaskBtn">Add</button>
            </div>
            <div id="tasksList" class="tasks-list"></div>

            <div class="tasks-title" style="margin-top:10px;">Transcribed Replies</div>
            <div id="repliesList" class="tasks-list" style="margin-top:4px; max-height:24vh;"></div>

            <div class="tasks-title" style="margin-top:10px;">Medication Log (last 24 hours)</div>
            <div class="tasks-input-row" style="margin-bottom:6px;">
                <select id="medNameSelect" style="flex:1; padding:4px 6px; border-radius:4px; border:1px solid #4b5563; background:#020617; color:#e5e7eb; font-size:0.85rem;">
                    <option value="Acetaminophen">Acetaminophen</option>
                    <option value="Oxycodone 5mg">Oxycodone 5mg</option>
                    <option value="Pregabalin 75mg">Pregabalin 75mg</option>
                    <option value="Ondansetron 8mg ODT">Ondansetron 8mg ODT</option>
                    <option value="Albuterol nebulizer (hand-held)">Albuterol nebulizer (hand-held)</option>
                    <option value="Other">Other</option>
                </select>
                <input id="medTabletsInput" type="number" min="1" step="1" value="1" style="width:60px; padding:4px 6px; border-radius:4px; border:1px solid #4b5563; background:#020617; color:#e5e7eb; font-size:0.85rem;" />
                <button id="addMedDoseBtn" style="padding:4px 8px; border-radius:4px; border:1px solid #22c55e; background:#022c22; color:#bbf7d0; font-size:0.8rem; cursor:pointer;">Add</button>
            </div>
            <input id="medNotesInput" type="text" placeholder="Notes (optional)" style="margin-bottom:6px; padding:4px 6px; border-radius:4px; border:1px solid #4b5563; background:#020617; color:#e5e7eb; font-size:0.85rem;" />
            <div id="medStatus" style="font-size:0.8rem; margin-bottom:6px; color:#e5e7eb;"></div>
            <div id="medsList" class="tasks-list" style="max-height:24vh;"></div>

            <div class="tasks-title" style="margin-top:10px;">Daily Med Log</div>
            <div id="dailyMedHeading" style="font-size:0.8rem; margin-bottom:4px; color:#e5e7eb;"></div>
            <div class="tasks-input-row" style="margin-bottom:6px; align-items:center;">
                <input id="dailyMedDate" type="date" style="flex:1; padding:4px 6px; border-radius:4px; border:1px solid #4b5563; background:#020617; color:#e5e7eb; font-size:0.85rem;" />
                <button id="loadDailyMedLogBtn" style="margin-left:4px; padding:4px 8px; border-radius:4px; border:1px solid #3b82f6; background:#0b1120; color:#bfdbfe; font-size:0.8rem; cursor:pointer;">Load day</button>
                <button id="printDailyMedLogBtn" style="margin-left:4px; padding:4px 8px; border-radius:4px; border:1px solid #6b7280; background:#020617; color:#e5e7eb; font-size:0.8rem; cursor:pointer;">Print</button>
            </div>
            <div id="dailyMedsList" class="tasks-list" style="max-height:24vh;"></div>
        </div>
    </div>

    <script>
        // TODO: Replace with your Firebase config from the Firebase console
        // const firebaseConfig = { ... };
        const firebaseConfig = {
            apiKey: "AIzaSyDeBCfq-UEwYUYEvzE2_8_ZuWGTiJQmOyg",
            authDomain: "home-messsaging.firebaseapp.com",
            projectId: "home-messsaging",
            storageBucket: "home-messsaging.firebasestorage.app",
            messagingSenderId: "497404009360",
            appId: "1:497404009360:web:ef9c7c6cb01476d4077115",
            measurementId: "G-ZXBF9KZM6P"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(window.firebaseConfig || firebaseConfig);
        const db = firebase.firestore();

        const messagesDiv = document.getElementById('messages');
        const newBanner = document.getElementById('newBanner');
        const muteToggle = document.getElementById('muteToggle');
        const repliesToggle = document.getElementById('repliesToggle');
        const clearMessagesBtn = document.getElementById('clearMessagesBtn');
        const clearRepliesBtn = document.getElementById('clearRepliesBtn');
        const taskInput = document.getElementById('taskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const tasksList = document.getElementById('tasksList');
        const repliesList = document.getElementById('repliesList');
        const medNameSelect = document.getElementById('medNameSelect');
        const medTabletsInput = document.getElementById('medTabletsInput');
        const medNotesInput = document.getElementById('medNotesInput');
        const addMedDoseBtn = document.getElementById('addMedDoseBtn');
        const medStatus = document.getElementById('medStatus');
        const medsList = document.getElementById('medsList');
        const dailyMedHeading = document.getElementById('dailyMedHeading');
        const dailyMedDate = document.getElementById('dailyMedDate');
        const loadDailyMedLogBtn = document.getElementById('loadDailyMedLogBtn');
        const printDailyMedLogBtn = document.getElementById('printDailyMedLogBtn');
        const dailyMedsList = document.getElementById('dailyMedsList');
        const householdInput = document.getElementById('householdId');
        const stationInput = document.getElementById('stationId');
        const displayNameInput = document.getElementById('displayName');
        const saveIdentityBtn = document.getElementById('saveIdentityBtn');
        const toStationInput = document.getElementById('toStation');
        const messageInputEl = document.getElementById('messageInput');
        const sendMessageBtn = document.getElementById('sendMessageBtn');
        const stationsBar = document.getElementById('stationsBar');
        const stationsEmpty = document.getElementById('stationsEmpty');
        let newBannerTimeout = null;

        // Track whether automatic reading is enabled
        let isMuted = false;

        // Intercom identity state
        let currentHouseholdId = '';
        let currentStationId = '';
        let currentDisplayName = '';
        let intercomUnsubscribe = null;
        let stationsUnsubscribe = null;
        const knownStations = new Set();
        const stationDisplayNames = new Map();

        if (muteToggle) {
            muteToggle.addEventListener('click', () => {
                isMuted = !isMuted;
                muteToggle.textContent = isMuted ? '🔇 Auto Read: OFF' : '🔊 Auto Read: ON';

                // Stop any current speech when muting
                if (isMuted && window.speechSynthesis) {
                    try {
                        window.speechSynthesis.cancel();
                    } catch (e) {
                        console.warn('Unable to cancel speech synthesis:', e);
                    }
                }
            });
        }

        function loadIdentityFromStorage() {
            try {
                const stored = JSON.parse(localStorage.getItem('intercomIdentity') || '{}');
                currentHouseholdId = stored.householdId || '';
                currentStationId = stored.stationId || '';
                currentDisplayName = stored.displayName || '';

                if (householdInput) householdInput.value = currentHouseholdId;
                if (stationInput) stationInput.value = currentStationId;
                if (displayNameInput) displayNameInput.value = currentDisplayName;
            } catch (e) {
                console.warn('Unable to load intercom identity from storage:', e);
            }
        }

        function saveIdentity() {
            currentHouseholdId = (householdInput?.value || '').trim();
            currentStationId = (stationInput?.value || '').trim();
            currentDisplayName = (displayNameInput?.value || '').trim();

            if (!currentHouseholdId || !currentStationId) {
                alert('Please enter both Household and Station.');
                return;
            }

            try {
                localStorage.setItem('intercomIdentity', JSON.stringify({
                    householdId: currentHouseholdId,
                    stationId: currentStationId,
                    displayName: currentDisplayName,
                }));
            } catch (e) {
                console.warn('Unable to save intercom identity to storage:', e);
            }
            // Also register this station in Firestore so others can see it
            if (currentHouseholdId && currentStationId) {
                try {
                    const stationDocId = `${currentHouseholdId}_${currentStationId}`;
                    db.collection('intercomStations').doc(stationDocId).set({
                        householdId: currentHouseholdId,
                        stationId: currentStationId,
                        displayName: currentDisplayName || currentStationId,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    }, { merge: true }).catch((e) => {
                        console.warn('Unable to save intercom station registry entry:', e);
                    });
                } catch (e) {
                    console.warn('Error registering station in intercomStations:', e);
                }
            }

            setupIntercomListener();
        }

        if (saveIdentityBtn) {
            saveIdentityBtn.addEventListener('click', saveIdentity);
        }

        function renderEmptyState() {
            messagesDiv.innerHTML = '<div class="empty-state">Waiting for messages...</div>';
        }

        function formatTimestamp(ts) {
            if (!ts) return '';
            const d = ts.toDate ? ts.toDate() : new Date(ts);

            const datePart = d.toLocaleDateString([], {
                year: 'numeric',
                month: 'short',   // e.g. Nov
                day: 'numeric'    // e.g. 19
            });

            const timePart = d.toLocaleTimeString([], {
                hour: 'numeric',
                minute: '2-digit'
            });

    return `${datePart} ${timePart}`;   // e.g. Nov 19, 7:12 PM
}
        function scrollToBottom() {
            requestAnimationFrame(() => {
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });
        }
        // ------------------------------------------------------------
        // Tasks: simple task list stored in Firestore (messageBoardTasks)
        // ------------------------------------------------------------

        async function addTask() {
            if (!taskInput) return;
            const text = taskInput.value.trim();
            if (!text) return;
            try {
                await db.collection('messageBoardTasks').add({
                    text,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                });
                taskInput.value = '';
            } catch (e) {
                console.warn('Error adding task:', e);
            }
        }

        if (addTaskBtn) {
            addTaskBtn.addEventListener('click', addTask);
        }
        if (taskInput) {
            taskInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addTask();
                }
            });
        }

        function renderTasks(snapshot) {
            if (!tasksList) return;
            if (snapshot.empty) {
                tasksList.textContent = 'No tasks yet.';
                return;
            }

            tasksList.innerHTML = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                const wrapper = document.createElement('div');
                wrapper.className = 'task-item';

                const textEl = document.createElement('div');
                textEl.className = 'task-text';
                textEl.textContent = data.text || '';

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'task-delete-btn';
                deleteBtn.textContent = 'Delete';
                deleteBtn.addEventListener('click', async () => {
                    try {
                        await doc.ref.delete();
                    } catch (e) {
                        console.warn('Error deleting task:', e);
                    }
                });

                wrapper.appendChild(textEl);
                wrapper.appendChild(deleteBtn);
                tasksList.appendChild(wrapper);
            });
        }

        function renderReplies(snapshot) {
            if (!repliesList) return;
            if (snapshot.empty) {
                repliesList.textContent = 'No replies yet.';
                return;
            }

            repliesList.innerHTML = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                const wrapper = document.createElement('div');
                wrapper.className = 'task-item';

                const textEl = document.createElement('div');
                textEl.className = 'task-text';
                textEl.textContent = data.text || '';

                const tsEl = document.createElement('div');
                tsEl.className = 'timestamp';
                tsEl.style.fontSize = '0.7rem';
                tsEl.textContent = formatTimestamp(data.createdAt);

                wrapper.appendChild(textEl);
                wrapper.appendChild(tsEl);
                repliesList.appendChild(wrapper);
            });
        }

        // ------------------------------------------------------------
        // Medication log: track doses in Firestore and compute last-24h
        // tablet totals for key meds.
        // ------------------------------------------------------------

        const ACETAMINOPHEN_NAME = 'Acetaminophen';
        const ACETAMINOPHEN_MAX_TABS = 6; // in 24 hours
        const OXYCODONE_NAME = 'Oxycodone 5mg';
        const OXYCODONE_MAX_TABS = 2;     // in 24 hours

        async function addMedDose() {
            if (!currentHouseholdId) {
                alert('Please set and save a Household before logging medication.');
                return;
            }

            const medName = (medNameSelect?.value || '').trim() || ACETAMINOPHEN_NAME;
            let tablets = parseInt(medTabletsInput?.value || '1', 10);
            if (!Number.isFinite(tablets) || tablets <= 0) {
                alert('Please enter a valid tablet count (at least 1).');
                return;
            }

            const notes = (medNotesInput?.value || '').trim();

            try {
                await db.collection('medsLog').add({
                    householdId: currentHouseholdId,
                    stationId: currentStationId || null,
                    medName,
                    tablets,
                    notes,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                });

                if (medNotesInput) medNotesInput.value = '';
                if (medTabletsInput) medTabletsInput.value = '1';
            } catch (e) {
                console.warn('Error logging medication dose:', e);
                alert('Failed to save medication dose. See console for details.');
            }
        }

        if (addMedDoseBtn) {
            addMedDoseBtn.addEventListener('click', addMedDose);
        }

        if (medNotesInput) {
            medNotesInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addMedDose();
                }
            });
        }
        function renderMeds(snapshot) {
            if (!medStatus || !medsList) return;

            const now = Date.now();
            const windowMs = 24 * 60 * 60 * 1000; // 24 hours

            let acetTabs = 0;
            let oxyTabs = 0;
            const recentDocs = [];

            snapshot.forEach((doc) => {
                const data = doc.data();
                if (!data) return;

                if (data.householdId && currentHouseholdId && data.householdId !== currentHouseholdId) {
                    return;
                }

                const ts = data.createdAt && data.createdAt.toDate ? data.createdAt.toDate() : null;
                if (!ts) return;
                const ageMs = now - ts.getTime();
                if (ageMs < 0 || ageMs > windowMs) {
                    return;
                }

                const medName = data.medName || '';
                const tablets = Number(data.tablets || 0) || 0;

                if (medName === ACETAMINOPHEN_NAME) {
                    acetTabs += tablets;
                } else if (medName === OXYCODONE_NAME) {
                    oxyTabs += tablets;
                }

                recentDocs.push({ id: doc.id, ts, medName, tablets, notes: data.notes || '' });
            });

            const lines = [];

            // Acetaminophen status
            const acetRatio = ACETAMINOPHEN_MAX_TABS > 0 ? acetTabs / ACETAMINOPHEN_MAX_TABS : 0;
            let acetText = `Acetaminophen: ${acetTabs} of ${ACETAMINOPHEN_MAX_TABS} tablets in last 24h.`;

            // Oxycodone status
            const oxyRatio = OXYCODONE_MAX_TABS > 0 ? oxyTabs / OXYCODONE_MAX_TABS : 0;
            let oxyText = `Oxycodone 5mg: ${oxyTabs} of ${OXYCODONE_MAX_TABS} tablets in last 24h.`;

            let color = '#bbf7d0'; // default green-ish
            if (acetRatio > 1 || oxyRatio > 1) {
                color = '#f97373';
                acetText += ' (Over limit - check dosing!)';
                oxyText += ' (Over limit - check dosing!)';
            } else if (acetRatio >= 0.9 || oxyRatio >= 0.9) {
                color = '#fde68a';
                acetText += ' (Near limit)';
                oxyText += ' (Near limit)';
            } else if (acetRatio >= 0.5 || oxyRatio >= 0.5) {
                color = '#facc15';
            }

            lines.push(acetText);
            lines.push(oxyText);

            medStatus.textContent = lines.join('  |  ');
            medStatus.style.color = color;

            // Render recent doses list (most recent first)
            medsList.innerHTML = '';
            if (recentDocs.length === 0) {
                medsList.textContent = 'No doses in the last 24 hours.';
                return;
            }

            recentDocs.sort((a, b) => b.ts.getTime() - a.ts.getTime());

            recentDocs.forEach((entry) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'task-item';

                const textEl = document.createElement('div');
                textEl.className = 'task-text';
                const when = entry.ts.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
                const notesPart = entry.notes ? ` – ${entry.notes}` : '';
                textEl.textContent = `${when} – ${entry.tablets} tab(s) ${entry.medName}${notesPart}`;

                wrapper.appendChild(textEl);

                // Only allow deletions from the Control station
                if (currentStationId === 'Control') {
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'task-delete-btn';
                    deleteBtn.textContent = 'Delete';
                    deleteBtn.addEventListener('click', async () => {
                        const confirmed = window.confirm('Delete this medication entry?');
                        if (!confirmed) return;
                        try {
                            await db.collection('medsLog').doc(entry.id).delete();
                        } catch (e) {
                            console.warn('Error deleting medication entry:', e);
                            alert('Failed to delete medication entry. See console for details.');
                        }
                    });
                    wrapper.appendChild(deleteBtn);
                }

                medsList.appendChild(wrapper);
            });
        }

        async function loadDailyMedLog() {
            if (!dailyMedsList) return;

            if (!currentHouseholdId) {
                alert('Please set and save a Household before loading the daily med log.');
                if (dailyMedHeading) dailyMedHeading.textContent = '';
                return;
            }

            const dateStr = dailyMedDate?.value || '';
            if (!dateStr) {
                alert('Please pick a date first.');
                if (dailyMedHeading) dailyMedHeading.textContent = '';
                return;
            }

            // Compute local start/end of the selected day
            const [year, month, day] = dateStr.split('-').map((part) => parseInt(part, 10));
            if (!year || !month || !day) {
                alert('Invalid date selected.');
                if (dailyMedHeading) dailyMedHeading.textContent = '';
                return;
            }

            const start = new Date(year, month - 1, day, 0, 0, 0, 0);
            const end = new Date(year, month - 1, day, 23, 59, 59, 999);

            if (dailyMedHeading) {
                const formatted = `${year.toString().padStart(4, '0')}-${month.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
                dailyMedHeading.textContent = `Medication Log for ${formatted} (Household ${currentHouseholdId})`;
            }

            dailyMedsList.innerHTML = 'Loading...';

            try {
                const snapshot = await db.collection('medsLog')
                    .where('householdId', '==', currentHouseholdId)
                    .orderBy('createdAt', 'asc')
                    .get();

                const entries = [];

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (!data) return;

                    const ts = data.createdAt && data.createdAt.toDate ? data.createdAt.toDate() : null;
                    if (!ts) return;

                    if (ts < start || ts > end) {
                        return;
                    }

                    entries.push({
                        ts,
                        medName: data.medName || '',
                        tablets: Number(data.tablets || 0) || 0,
                        notes: data.notes || '',
                    });
                });

                dailyMedsList.innerHTML = '';

                if (entries.length === 0) {
                    dailyMedsList.textContent = 'No medication entries for this date.';
                    return;
                }

                entries.sort((a, b) => a.ts.getTime() - b.ts.getTime());

                entries.forEach((entry) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'task-item';

                    const textEl = document.createElement('div');
                    textEl.className = 'task-text';
                    const when = entry.ts.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
                    const notesPart = entry.notes ? ` – ${entry.notes}` : '';
                    textEl.textContent = `${when} – ${entry.tablets} tab(s) ${entry.medName}${notesPart}`;

                    wrapper.appendChild(textEl);
                    dailyMedsList.appendChild(wrapper);
                });
            } catch (e) {
                console.warn('Error loading daily med log:', e);
                dailyMedsList.textContent = 'Error loading daily med log. See console for details.';
                if (dailyMedHeading) dailyMedHeading.textContent = '';
            }
        }

        function printDailyMedLog() {
            try {
                window.print();
            } catch (e) {
                console.warn('Unable to open print dialog:', e);
            }
        }

        if (loadDailyMedLogBtn) {
            loadDailyMedLogBtn.addEventListener('click', loadDailyMedLog);
        }

        if (printDailyMedLogBtn) {
            printDailyMedLogBtn.addEventListener('click', printDailyMedLog);
        }

        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.type = 'sine';
                o.frequency.value = 880;     // pitch
                o.connect(g);
                g.connect(ctx.destination);
                g.gain.setValueAtTime(0.5, ctx.currentTime);  // volume
                o.start();
                o.stop(ctx.currentTime + 0.5);                // 0.5 second beep
            } catch (e) {
                console.warn('Audio not available:', e);
            }
        }

        // Choose a default English (US) voice if available
        function getDefaultVoice() {
            if (!('speechSynthesis' in window)) return null;
            const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
            if (!voices || voices.length === 0) return null;

            const usVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en-us'));
            return (usVoices[0] || voices[0]) || null;
        }

        // Speak a given message text out loud (if not muted and supported)
        function speakMessage(text) {
            if (!text || isMuted) return;

            // If speech is not supported, fall back to the beep so we still
            // have an audio alert when Auto Read is ON.
            if (!('speechSynthesis' in window) || typeof window.SpeechSynthesisUtterance === 'undefined') {
                console.warn('Speech synthesis not supported on this device. Using beep fallback.');
                playBeep();
                return;
            }

            try {
                // Cancel any ongoing speech so the latest message is clear
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;   // speed
                utterance.pitch = 1.0;  // voice pitch
                utterance.lang = 'en-US';

                const defaultVoice = getDefaultVoice();
                if (defaultVoice) {
                    utterance.voice = defaultVoice;
                }

                window.speechSynthesis.speak(utterance);
            } catch (e) {
                console.warn('Speech synthesis failed, using beep fallback:', e);
                // If something goes wrong starting TTS, at least play the beep.
                playBeep();
            }
        }

        // Keep track of messages that have already been spoken so we only
        // auto-read newly added messages, not the full history every time.
        const spokenMessageIds = new Set();

        // ------------------------------------------------------------
        // Speech recognition: capture her spoken replies and send them
        // back as text to Firestore (messageBoardReplies collection).
        // Activated manually via the Voice Replies toggle so other devices
        // (like Ubuntu laptop) don't use the mic unless explicitly enabled.
        // ------------------------------------------------------------

        let recognition = null;
        let recognitionActive = false;

        function setupSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                console.warn('SpeechRecognition API not available in this browser. Reply transcription disabled.');
                return;
            }
            if (recognition) {
                // Already set up
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            let shouldKeepListening = true;
            let restartDelayMs = 1000; // start with 1s delay between restarts
            const maxRestartDelayMs = 10000; // cap backoff at 10s
            let lastErrorTime = 0;

            recognition.onresult = async (event) => {
                try {
                    const result = event.results[event.resultIndex];
                    if (!result || result.length === 0) return;
                    const transcript = (result[0].transcript || '').trim();
                    if (!transcript) return;

                    // Send her spoken reply as a separate document
                    await db.collection('messageBoardReplies').add({
                        text: transcript,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    });
                } catch (err) {
                    console.warn('Error saving speech recognition result:', err);
                }
            };

            recognition.onerror = (event) => {
                console.warn('SpeechRecognition error:', event.error);
                const now = Date.now();
                lastErrorTime = now;

                // If the user denied permission or the service is unavailable,
                // stop trying to restart.
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    shouldKeepListening = false;
                    recognitionActive = false;
                    return;
                }

                // For transient errors (no-speech, audio-capture, network),
                // increase the restart delay a bit to avoid rapid toggling.
                if (event.error === 'no-speech' || event.error === 'audio-capture' || event.error === 'network') {
                    restartDelayMs = Math.min(maxRestartDelayMs, restartDelayMs + 1000);
                }
            };

            recognition.onend = () => {
                // Auto-restart if we still want to listen (tab still open,
                // permission granted, etc.), but with a small delay so the
                // mic indicator doesn't flicker rapidly.
                if (shouldKeepListening) {
                    setTimeout(() => {
                        try {
                            recognition.start();
                            recognitionActive = true;
                        } catch (e) {
                            console.warn('Failed to restart SpeechRecognition:', e);
                        }
                    }, restartDelayMs);
                }
            };

        }

        function startVoiceReplies() {
            setupSpeechRecognition();
            if (!recognition) return;
            try {
                recognition.start();
                recognitionActive = true;
            } catch (e) {
                console.warn('Unable to start SpeechRecognition:', e);
            }
        }

        function stopVoiceReplies() {
            if (recognition && recognitionActive) {
                try {
                    recognition.stop();
                } catch (e) {
                    console.warn('Unable to stop SpeechRecognition:', e);
                }
            }
            recognitionActive = false;
        }
        if (repliesToggle) {
            repliesToggle.addEventListener('click', () => {
                recognitionActive = !recognitionActive;
                if (recognitionActive) {
                    repliesToggle.textContent = '🎤 Voice Replies: ON';
                    startVoiceReplies();
                } else {
                    repliesToggle.textContent = '🎤 Voice Replies: OFF';
                    stopVoiceReplies();
                }
            });
        }

        async function clearIntercomMessages() {
            if (!currentHouseholdId) {
                alert('Please set and save a Household before clearing messages.');
                return;
            }

            const confirmed = window.confirm(`Clear all messages for household "${currentHouseholdId}"? This cannot be undone.`);
            if (!confirmed) return;

            try {
                const snapshot = await db.collection('intercomMessages')
                    .where('householdId', '==', currentHouseholdId)
                    .get();

                const batch = db.batch();
                snapshot.forEach((doc) => {
                    batch.delete(doc.ref);
                });

                await batch.commit();

                // Local UI cleanup; listener will also see an empty snapshot.
                messagesDiv.innerHTML = '';
                renderEmptyState();
                spokenMessageIds.clear();
            } catch (e) {
                console.error('Error clearing intercom messages:', e);
                alert('Failed to clear messages. See console for details.');
            }
        }

        if (clearMessagesBtn) {
            clearMessagesBtn.addEventListener('click', clearIntercomMessages);
        }

        async function clearTranscribedReplies() {
            const confirmed = window.confirm('Clear all transcribed replies? This cannot be undone.');
            if (!confirmed) return;

            try {
                const snapshot = await db.collection('messageBoardReplies').get();
                const batch = db.batch();
                snapshot.forEach((doc) => {
                    batch.delete(doc.ref);
                });
                await batch.commit();

                if (repliesList) {
                    repliesList.innerHTML = '';
                    repliesList.textContent = 'No replies yet.';
                }
            } catch (e) {
                console.error('Error clearing replies:', e);
                alert('Failed to clear replies. See console for details.');
            }
        }

        if (clearRepliesBtn) {
            clearRepliesBtn.addEventListener('click', clearTranscribedReplies);
        }

        // Listen for tasks in real time
        db.collection('messageBoardTasks')
          .orderBy('createdAt', 'asc')
          .onSnapshot((snapshot) => {
              try {
                  renderTasks(snapshot);
              } catch (e) {
                  console.warn('Error rendering tasks:', e);
              }
          }, (err) => {
              console.error('Error listening for tasks:', err);
              if (tasksList) {
                  tasksList.textContent = 'Error loading tasks.';
              }
          });

        // Listen for transcribed replies in real time
        db.collection('messageBoardReplies')
          .orderBy('createdAt', 'asc')
          .onSnapshot((snapshot) => {
              try {
                  renderReplies(snapshot);
              } catch (e) {
                  console.warn('Error rendering replies:', e);
              }
          }, (err) => {
              console.error('Error listening for replies:', err);
              if (repliesList) {
                  repliesList.textContent = 'Error loading replies.';
              }
          });

        // Listen for medication log entries in real time
        db.collection('medsLog')
          .orderBy('createdAt', 'asc')
          .onSnapshot((snapshot) => {
              try {
                  renderMeds(snapshot);
              } catch (e) {
                  console.warn('Error rendering meds log:', e);
              }
          }, (err) => {
              console.error('Error listening for meds log:', err);
              if (medStatus) {
                  medStatus.textContent = 'Error loading medication log.';
                  medStatus.style.color = '#f97373';
              }
              if (medsList) {
                  medsList.textContent = '';
              }
          });

        function setupIntercomListener() {
            if (!currentHouseholdId) {
                renderEmptyState();
                return;
            }

            if (intercomUnsubscribe) {
                try {
                    intercomUnsubscribe();
                } catch (e) {
                    console.warn('Error unsubscribing previous intercom listener:', e);
                }
                intercomUnsubscribe = null;
            }

            if (stationsUnsubscribe) {
                try {
                    stationsUnsubscribe();
                } catch (e) {
                    console.warn('Error unsubscribing previous stations listener:', e);
                }
                stationsUnsubscribe = null;
            }

            messagesDiv.innerHTML = '';
            renderEmptyState();

            // Reset known stations when switching households
            knownStations.clear();
            stationDisplayNames.clear();
            renderKnownStations();

            // Listen for registered stations for this household
            try {
                stationsUnsubscribe = db.collection('intercomStations')
                    .where('householdId', '==', currentHouseholdId)
                    .orderBy('stationId', 'asc')
                    .onSnapshot((snapshot) => {
                        knownStations.clear();
                        stationDisplayNames.clear();
                        snapshot.forEach((doc) => {
                            const data = doc.data();
                            const sid = (data.stationId || '').trim();
                            if (sid && sid !== currentStationId) {
                                knownStations.add(sid);
                                if (data.displayName) {
                                    stationDisplayNames.set(sid, data.displayName);
                                }
                            }
                        });
                        renderKnownStations();
                    }, (err) => {
                        console.error('Error listening for stations:', err);
                    });
            } catch (e) {
                console.error('Failed to set up stations listener:', e);
            }

            try {
                intercomUnsubscribe = db.collection('intercomMessages')
                    .where('householdId', '==', currentHouseholdId)
                    .orderBy('createdAt', 'asc')
                    .onSnapshot((snapshot) => {
                        if (snapshot.empty) {
                            renderEmptyState();
                            return;
                        }

                        messagesDiv.innerHTML = '';

                        snapshot.forEach((doc) => {
                            const data = doc.data();

                            // Only show messages for this station or broadcasts
                            const toStation = (data.toStation || 'all').trim();
                            if (currentStationId && toStation !== 'all' && toStation !== currentStationId) {
                                return;
                            }

                            const senderName = (data.fromName || data.fromStation || 'Unknown').trim();
                            const mainText = data.text || '';

                            const msgEl = document.createElement('div');
                            msgEl.className = 'message';
                            msgEl.textContent = senderName ? `${senderName}: ${mainText}` : mainText;

                            const tsEl = document.createElement('div');
                            tsEl.className = 'timestamp';
                            tsEl.textContent = formatTimestamp(data.createdAt);

                            msgEl.appendChild(tsEl);
                            messagesDiv.appendChild(msgEl);
                        });

                        scrollToBottom();

                        // Only play the beep when auto-read is OFF (muted)
                        if (isMuted) {
                            playBeep();
                        }

                        // Auto-read only newly added messages since the last snapshot
                        snapshot.docChanges().forEach((change) => {
                            if (change.type === 'added') {
                                const doc = change.doc;
                                const data = doc.data();
                                const id = doc.id;

                                const toStation = (data.toStation || 'all').trim();
                                if (currentStationId && toStation !== 'all' && toStation !== currentStationId) {
                                    return;
                                }

                                if (!spokenMessageIds.has(id)) {
                                    spokenMessageIds.add(id);
                                    speakMessage(data.text || '');
                                }
                            }
                        });

                        if (newBanner) {
                            newBanner.style.display = 'block';
                            if (newBannerTimeout) {
                                clearTimeout(newBannerTimeout);
                            }
                            newBannerTimeout = setTimeout(() => {
                                newBanner.style.display = 'none';
                            }, 3000);
                        }
                    }, (err) => {
                        console.error('Error listening for intercom messages:', err);
                        messagesDiv.innerHTML = '<div class="empty-state">Error loading messages.</div>';
                    });
            } catch (e) {
                console.error('Failed to set up intercom listener:', e);
                messagesDiv.innerHTML = '<div class="empty-state">Error setting up intercom listener.</div>';
            }
        }

        async function sendIntercomMessage() {
            if (!currentHouseholdId || !currentStationId) {
                alert('Please set and save Household and Station first.');
                return;
            }

            const text = (messageInputEl?.value || '').trim();
            if (!text) return;

            const toStationRaw = (toStationInput?.value || '').trim();
            const toStation = toStationRaw || 'all';

            if (toStation !== 'all' && !knownStations.has(toStation)) {
                alert(`Station "${toStation}" does not exist in this household. Please choose a station from the Known stations list or use "all".`);
                return;
            }

            try {
                await db.collection('intercomMessages').add({
                    householdId: currentHouseholdId,
                    fromStation: currentStationId,
                    fromName: currentDisplayName || currentStationId,
                    toStation,
                    text,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                });

                if (messageInputEl) {
                    messageInputEl.value = '';
                }
            } catch (e) {
                console.warn('Error sending intercom message:', e);
            }
        }

        if (sendMessageBtn) {
            sendMessageBtn.addEventListener('click', sendIntercomMessage);
        }

        if (messageInputEl) {
            messageInputEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendIntercomMessage();
                }
            });
        }

        function renderKnownStations() {
            if (!stationsBar) return;

            // Remove previous chips but keep the label element
            const chips = stationsBar.querySelectorAll('.station-chip');
            chips.forEach(chip => chip.remove());

            const stations = Array.from(knownStations).sort();

            if (stationsEmpty) {
                stationsEmpty.style.display = stations.length === 0 ? 'inline' : 'none';
            }

            // Always include an 'all' chip for broadcast
            const allChip = document.createElement('button');
            allChip.type = 'button';
            allChip.className = 'station-chip';
            allChip.textContent = 'all';
            allChip.addEventListener('click', () => {
                if (toStationInput) {
                    toStationInput.value = 'all';
                }
            });
            stationsBar.appendChild(allChip);

            stations.forEach((stationId) => {
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'station-chip';
                const displayName = stationDisplayNames.get(stationId) || stationId;
                chip.title = displayName;

                const labelSpan = document.createElement('span');
                labelSpan.textContent = stationId;
                labelSpan.style.marginRight = '4px';

                const deleteSpan = document.createElement('span');
                deleteSpan.textContent = '×';
                deleteSpan.style.cursor = 'pointer';
                deleteSpan.style.color = '#fca5a5';

                chip.appendChild(labelSpan);
                chip.appendChild(deleteSpan);

                chip.addEventListener('click', (e) => {
                    // If the delete icon was clicked, handle deletion instead
                    if (e.target === deleteSpan) {
                        e.stopPropagation();
                        if (!currentHouseholdId) return;
                        const confirmed = window.confirm(`Remove station "${stationId}" from this household?`);
                        if (!confirmed) return;
                        const stationDocId = `${currentHouseholdId}_${stationId}`;
                        db.collection('intercomStations').doc(stationDocId).delete().catch((err) => {
                            console.warn('Error deleting station from registry:', err);
                        });
                    } else {
                        if (toStationInput) {
                            toStationInput.value = stationId;
                        }
                    }
                });

                stationsBar.appendChild(chip);
            });
        }

        // Initial setup: load identity and, if available, start listening
        loadIdentityFromStorage();
        if (currentHouseholdId && currentStationId) {
            setupIntercomListener();
        }
    </script>
</body>
</html>

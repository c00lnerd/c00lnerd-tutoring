<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Board - Sender</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 480px;
            width: 100%;
            padding: 24px 24px 20px 24px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        p.subtitle {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-top: 12px;
            margin-bottom: 6px;
        }
        input[type="password"], textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 1rem;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        button {
            margin-top: 16px;
            width: 100%;
            padding: 12px;
            border-radius: 999px;
            border: none;
            background: #2563eb;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
            cursor: default;
        }
        .status {
            margin-top: 10px;
            font-size: 0.9rem;
        }
        .status.ok { color: #16a34a; }
        .status.error { color: #dc2626; }
        .secondary {
            margin-top: 8px;
            background: #6b7280;
        }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="card">
        <h1>Send Message to Board</h1>
        <p class="subtitle">Enter the password once, then send messages to the bedside screen.</p>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" />

        <label for="message">Message</label>
        <textarea id="message" placeholder="Type your message here..."></textarea>

        <button id="sendBtn" disabled>Unlock with Password</button>
        <button id="clearBtn" class="secondary" disabled>Clear All Messages</button>
        <div id="status" class="status"></div>

        <div style="margin-top: 18px; padding-top: 10px; border-top: 1px solid #e5e7eb;">
            <label>Tasks</label>
            <div style="display: flex; gap: 6px; margin-top: 4px; margin-bottom: 8px;">
                <input id="taskInput" type="text" placeholder="New task..." style="flex: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid #d1d5db; font-size: 0.9rem;" />
                <button id="addTaskBtn" class="secondary" style="width: auto; padding-inline: 10px; background: #16a34a;">
                    Add
                </button>
            </div>
            <div id="tasksList" style="max-height: 160px; overflow-y: auto; font-size: 0.9rem; color: #374151; border: 1px solid #e5e7eb; border-radius: 8px; padding: 6px 8px; background: #f9fafb; margin-bottom: 10px;"></div>
            <button id="clearTasksBtn" class="secondary" style="width: 100%; background: #6b7280;">
                Clear All Tasks
            </button>
        </div>

        <div style="margin-top: 12px; padding-top: 10px; border-top: 1px solid #e5e7eb;">
            <label>Her Responses (speech-to-text)</label>
            <div id="replies" style="max-height: 200px; overflow-y: auto; font-size: 0.9rem; color: #374151; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px; background: #f9fafb;"></div>
            <button id="clearRepliesBtn" class="secondary" style="margin-top: 8px; width: 100%; background: #4b5563;">
                Clear Responses
            </button>
        </div>
    </div>

    <script>
        // Change this password whenever you like
        const SENDER_PASSWORD = '0Bstacles';

        // TODO: Replace with your Firebase config from the Firebase console
        // const firebaseConfig = { ... };
        const firebaseConfig = {
            apiKey: "AIzaSyDeBCfq-UEwYUYEvzE2_8_ZuWGTiJQmOyg",
            authDomain: "home-messsaging.firebaseapp.com",
            projectId: "home-messsaging",
            storageBucket: "home-messsaging.firebasestorage.app",
            messagingSenderId: "497404009360",
            appId: "1:497404009360:web:ef9c7c6cb01476d4077115",
  measurementId: "G-ZXBF9KZM6P"
};
        if (!window.firebaseConfig) {
            console.warn('Remember to define firebaseConfig in this file.');
        }

        // Initialize Firebase
        const app = firebase.initializeApp(window.firebaseConfig || firebaseConfig);
        const db = firebase.firestore();

        const passwordInput = document.getElementById('password');
        const messageInput = document.getElementById('message');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statusEl = document.getElementById('status');
        const repliesDiv = document.getElementById('replies');
        const clearRepliesBtn = document.getElementById('clearRepliesBtn');
        const taskInput = document.getElementById('taskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const tasksList = document.getElementById('tasksList');
        const clearTasksBtn = document.getElementById('clearTasksBtn');

        let unlocked = false;

        function setStatus(msg, type) {
            statusEl.textContent = msg || '';
            statusEl.className = 'status ' + (type || '');
        }

        function formatTimestamp(ts) {
            if (!ts) return '';
            const d = ts.toDate ? ts.toDate() : new Date(ts);
            return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        }

        // ------------------------
        // Tasks helpers
        // ------------------------

        async function addTask() {
            if (!taskInput) return;
            const text = taskInput.value.trim();
            if (!text) return;
            try {
                await db.collection('messageBoardTasks').add({
                    text,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                });
                taskInput.value = '';
            } catch (e) {
                console.error('Error adding task:', e);
                setStatus('Error adding task.', 'error');
            }
        }

        function renderTasks(snapshot) {
            if (!tasksList) return;
            if (snapshot.empty) {
                tasksList.textContent = 'No tasks yet.';
                return;
            }

            tasksList.innerHTML = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                const wrapper = document.createElement('div');
                wrapper.style.display = 'flex';
                wrapper.style.justifyContent = 'space-between';
                wrapper.style.alignItems = 'flex-start';
                wrapper.style.gap = '6px';
                wrapper.style.marginBottom = '4px';

                const textEl = document.createElement('div');
                textEl.textContent = data.text || '';
                textEl.style.flex = '1';

                const delBtn = document.createElement('button');
                delBtn.textContent = 'Delete';
                delBtn.style.fontSize = '0.75rem';
                delBtn.style.padding = '2px 6px';
                delBtn.style.borderRadius = '999px';
                delBtn.style.border = '1px solid #dc2626';
                delBtn.style.background = '#fee2e2';
                delBtn.style.color = '#991b1b';
                delBtn.style.cursor = 'pointer';
                delBtn.addEventListener('click', async () => {
                    try {
                        await doc.ref.delete();
                    } catch (e) {
                        console.error('Error deleting task:', e);
                        setStatus('Error deleting task.', 'error');
                    }
                });

                wrapper.appendChild(textEl);
                wrapper.appendChild(delBtn);
                tasksList.appendChild(wrapper);
            });
        }

        function tryUnlock() {
            if (passwordInput.value === SENDER_PASSWORD) {
                unlocked = true;
                sendBtn.textContent = 'Send Message';
                sendBtn.disabled = false;
                clearBtn.disabled = false;
                setStatus('Unlocked. You can now send messages.', 'ok');
                passwordInput.disabled = true;
            } else {
                setStatus('Incorrect password.', 'error');
                sendBtn.disabled = true;
                clearBtn.disabled = true;
            }
        }

        passwordInput.addEventListener('input', () => {
            if (passwordInput.value.length === 0) {
                sendBtn.textContent = 'Unlock with Password';
                sendBtn.disabled = true;
                clearBtn.disabled = true;
                unlocked = false;
                setStatus('', '');
                return;
            }
            // Allow click to attempt unlock
            sendBtn.disabled = false;
            sendBtn.textContent = unlocked ? 'Send Message' : 'Unlock with Password';
        });

        sendBtn.addEventListener('click', async () => {
            if (!unlocked) {
                tryUnlock();
                return;
            }

            const text = messageInput.value.trim();
            if (!text) {
                setStatus('Please enter a message first.', 'error');
                return;
            }

            sendBtn.disabled = true;
            setStatus('Sending...', '');

            try {
                await db.collection('messageBoard').add({
                    text,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                });
                messageInput.value = '';
                setStatus('Message sent.', 'ok');
            } catch (err) {
                console.error('Error sending message:', err);
                setStatus('Error sending message.', 'error');
            } finally {
                sendBtn.disabled = false;
            }
        });

        clearBtn.addEventListener('click', async () => {
            if (!unlocked) {
                tryUnlock();
                return;
            }

            if (!confirm('Clear all messages from the board?')) {
                return;
            }

            clearBtn.disabled = true;
            sendBtn.disabled = true;
            setStatus('Clearing all messages...', '');

            try {
                const snapshot = await db.collection('messageBoard').get();
                const batch = db.batch();
                snapshot.forEach((doc) => batch.delete(doc.ref));
                await batch.commit();
                setStatus('All messages cleared.', 'ok');
            } catch (err) {
                console.error('Error clearing messages:', err);
                setStatus('Error clearing messages.', 'error');
            } finally {
                sendBtn.disabled = false;
                clearBtn.disabled = false;
            }
        });

        clearRepliesBtn.addEventListener('click', async () => {
            if (!unlocked) {
                tryUnlock();
                if (!unlocked) return;
            }

            if (!confirm('Clear all transcribed responses?')) {
                return;
            }

            clearRepliesBtn.disabled = true;
            setStatus('Clearing responses...', '');

            try {
                const snapshot = await db.collection('messageBoardReplies').get();
                const batch = db.batch();
                snapshot.forEach((doc) => batch.delete(doc.ref));
                await batch.commit();
                setStatus('Responses cleared.', 'ok');
            } catch (err) {
                console.error('Error clearing responses:', err);
                setStatus('Error clearing responses.', 'error');
            } finally {
                clearRepliesBtn.disabled = false;
            }
        });

        if (addTaskBtn) {
            addTaskBtn.addEventListener('click', addTask);
        }
        if (taskInput) {
            taskInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addTask();
                }
            });
        }

        if (clearTasksBtn) {
            clearTasksBtn.addEventListener('click', async () => {
                if (!unlocked) {
                    tryUnlock();
                    if (!unlocked) return;
                }

                if (!confirm('Clear all tasks?')) {
                    return;
                }

                clearTasksBtn.disabled = true;
                setStatus('Clearing tasks...', '');

                try {
                    const snapshot = await db.collection('messageBoardTasks').get();
                    const batch = db.batch();
                    snapshot.forEach((doc) => batch.delete(doc.ref));
                    await batch.commit();
                    setStatus('Tasks cleared.', 'ok');
                } catch (err) {
                    console.error('Error clearing tasks:', err);
                    setStatus('Error clearing tasks.', 'error');
                } finally {
                    clearTasksBtn.disabled = false;
                }
            });
        }

        // Listen for tasks in real time
        db.collection('messageBoardTasks')
          .orderBy('createdAt', 'asc')
          .onSnapshot((snapshot) => {
              try {
                  renderTasks(snapshot);
              } catch (e) {
                  console.error('Error rendering tasks:', e);
                  if (tasksList) {
                      tasksList.textContent = 'Error displaying tasks.';
                  }
              }
          }, (err) => {
              console.error('Error loading tasks:', err);
              if (tasksList) {
                  tasksList.textContent = 'Error loading tasks.';
              }
          });

        // Listen for her transcribed replies in real time
        db.collection('messageBoardReplies')
          .orderBy('createdAt', 'asc')
          .onSnapshot((snapshot) => {
              if (!repliesDiv) return;
              if (snapshot.empty) {
                  repliesDiv.textContent = 'No responses yet.';
                  return;
              }

              repliesDiv.innerHTML = '';
              snapshot.forEach((doc) => {
                  const data = doc.data();
                  const wrapper = document.createElement('div');
                  wrapper.style.marginBottom = '6px';

                  const textEl = document.createElement('div');
                  textEl.textContent = data.text || '';

                  const tsEl = document.createElement('div');
                  tsEl.style.fontSize = '0.8rem';
                  tsEl.style.color = '#6b7280';
                  tsEl.textContent = formatTimestamp(data.createdAt);

                  wrapper.appendChild(textEl);
                  wrapper.appendChild(tsEl);
                  repliesDiv.appendChild(wrapper);
              });

              // Scroll to bottom so latest reply is visible
              repliesDiv.scrollTop = repliesDiv.scrollHeight;
          }, (err) => {
              console.error('Error loading replies:', err);
              if (repliesDiv) {
                  repliesDiv.textContent = 'Error loading responses.';
              }
          });
    </script>
</body>
</html>

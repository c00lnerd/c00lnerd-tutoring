<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Board - Sender</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 480px;
            width: 100%;
            padding: 24px 24px 20px 24px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        p.subtitle {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-top: 12px;
            margin-bottom: 6px;
        }
        input[type="password"], textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 1rem;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        button {
            margin-top: 16px;
            width: 100%;
            padding: 12px;
            border-radius: 999px;
            border: none;
            background: #2563eb;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
            cursor: default;
        }
        .status {
            margin-top: 10px;
            font-size: 0.9rem;
        }
        .status.ok { color: #16a34a; }
        .status.error { color: #dc2626; }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="card">
        <h1>Send Message to Board</h1>
        <p class="subtitle">Enter the password once, then send messages to the bedside screen.</p>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" />

        <label for="message">Message</label>
        <textarea id="message" placeholder="Type your message here..."></textarea>

        <button id="sendBtn" disabled>Unlock with Password</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        // Change this password whenever you like
        const SENDER_PASSWORD = '0Bstacles';

        // TODO: Replace with your Firebase config from the Firebase console
        // const firebaseConfig = { ... };
        const firebaseConfig = {
            apiKey: "AIzaSyDeBCfq-UEwYUYEvzE2_8_ZuWGTiJQmOyg",
            authDomain: "home-messsaging.firebaseapp.com",
            projectId: "home-messsaging",
            storageBucket: "home-messsaging.firebasestorage.app",
            messagingSenderId: "497404009360",
            appId: "1:497404009360:web:ef9c7c6cb01476d4077115",
  measurementId: "G-ZXBF9KZM6P"
};
        if (!window.firebaseConfig) {
            console.warn('Remember to define firebaseConfig in this file.');
        }

        // Initialize Firebase
        const app = firebase.initializeApp(window.firebaseConfig || firebaseConfig);
        const db = firebase.firestore();

        const passwordInput = document.getElementById('password');
        const messageInput = document.getElementById('message');
        const sendBtn = document.getElementById('sendBtn');
        const statusEl = document.getElementById('status');

        let unlocked = false;

        function setStatus(msg, type) {
            statusEl.textContent = msg || '';
            statusEl.className = 'status ' + (type || '');
        }

        function tryUnlock() {
            if (passwordInput.value === SENDER_PASSWORD) {
                unlocked = true;
                sendBtn.textContent = 'Send Message';
                sendBtn.disabled = false;
                setStatus('Unlocked. You can now send messages.', 'ok');
                passwordInput.disabled = true;
            } else {
                setStatus('Incorrect password.', 'error');
                sendBtn.disabled = true;
            }
        }

        passwordInput.addEventListener('input', () => {
            if (passwordInput.value.length === 0) {
                sendBtn.textContent = 'Unlock with Password';
                sendBtn.disabled = true;
                unlocked = false;
                setStatus('', '');
                return;
            }
            // Allow click to attempt unlock
            sendBtn.disabled = false;
            sendBtn.textContent = unlocked ? 'Send Message' : 'Unlock with Password';
        });

        sendBtn.addEventListener('click', async () => {
            if (!unlocked) {
                tryUnlock();
                return;
            }

            const text = messageInput.value.trim();
            if (!text) {
                setStatus('Please enter a message first.', 'error');
                return;
            }

            sendBtn.disabled = true;
            setStatus('Sending...', '');

            try {
                await db.collection('messageBoard').add({
                    text,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                });
                messageInput.value = '';
                setStatus('Message sent.', 'ok');
            } catch (err) {
                console.error('Error sending message:', err);
                setStatus('Error sending message.', 'error');
            } finally {
                sendBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
